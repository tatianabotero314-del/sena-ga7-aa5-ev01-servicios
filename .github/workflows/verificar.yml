name: Verificar servicios de registro y autenticación
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Incorporar fuentes del caso
        run: |
          if [ ! -f pom.xml ]; then
            python3 - <<'PYCODE'
          import base64, io, zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(""))).extractall('.')
          PYCODE
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs tests pom.xml package.json playwright.config.js README.md .gitignore
          git diff --cached --quiet || git commit -m "Versionar servicios, validaciones y pruebas del caso"
          git push
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar 15 pruebas de integración
        run: mvn -B verify
      - name: Iniciar el servicio real con una base aislada
        run: |
          java -jar target/servicios-registro-login-1.0.0.jar --spring.datasource.url='jdbc:h2:mem:navegador;DB_CLOSE_DELAY=-1' > servicio.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/salud > /dev/null; then exit 0; fi
            sleep 2
          done
          cat servicio.log
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Preparar el navegador
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Fijar dependencias de las pruebas de navegador"
          git push
      - name: Verificar registro, autenticación y errores en Chromium
        run: npm run test:e2e
      - name: Guardar fuentes verificadas e historial
        if: always()
        run: |
          git bundle create historial-github.bundle --all
          zip -r proyecto-verificado.zip src docs tests pom.xml package.json package-lock.json playwright.config.js README.md .gitignore .github
      - name: Publicar reportes y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-AA5-EV01
          path: |
            target/surefire-reports
            test-results
            playwright-report
            proyecto-verificado.zip
            historial-github.bundle
            servicio.log
